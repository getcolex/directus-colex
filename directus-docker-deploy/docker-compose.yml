services:
  postgres:
    image: postgis/postgis:13-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  directus:
    image: directus/directus:latest
    restart: unless-stopped
    ports:
      - "8055:8055"
    env_file:
      - .env
    depends_on:
      - postgres
    environment:
      # Database connection
      DB_CLIENT: pg
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED}
      DB_SCHEMA: public

      # Admin setup
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # Secrets
      KEY: ${KEY}
      SECRET: ${SECRET}

      # Other settings
      PUBLIC_URL: ${PUBLIC_URL}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      DISABLE_TELEMETRY: ${DISABLE_TELEMETRY}
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      # Force Schema Detection
      DB_EXCLUDE_TABLES: ""
      EXTENSIONS_AUTO_RELOAD: true
      EXTENSIONS_PATH: /directus/extensions
      LOG_LEVEL: debug

      # OpenRouter API for Intelligence Chat
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

      # Lead Gen APIs
      EXA_API_KEY: ${EXA_API_KEY}

    volumes:
      - uploads:/directus/uploads
      - extensions:/directus/extensions
      - ../extensions/directus-extension-wcag-theme-colex-light:/directus/extensions/directus-extension-wcag-theme-colex-light
      - ../extensions/directus-extension-wcag-theme-colex-dark:/directus/extensions/directus-extension-wcag-theme-colex-dark
      - ../extensions/directus-extension-configurable-button:/directus/extensions/directus-extension-configurable-button
      - ../extensions/directus-extension-review-module:/directus/extensions/directus-extension-review-module
      - ../extensions/directus-hook-populate-button-context:/directus/extensions/directus-hook-populate-button-context
      - ../extensions/directus-hook-task-dependency-v2:/directus/extensions/directus-hook-task-dependency-v2
      - ../extensions/directus-endpoint-webhook-proxy:/directus/extensions/directus-endpoint-webhook-proxy

volumes:
  uploads:
  extensions:
  postgres_data: