services:
  postgres:
    image: postgres:15-alpine
    restart: "no"
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: directus_local_password
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - directus_local

  directus:
    image: directus/directus:latest
    restart: "no"
    ports:
      - "8055:8055"
    env_file:
      - .env
    depends_on:
      - postgres
    environment:
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-directus}
      DB_USER: ${DB_USER:-directus}
      DB_PASSWORD: directus_local_password
      DB_SSL: false
      DB_SSL_REJECT_UNAUTHORIZED: false
      DB_SCHEMA: public
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-d1r3ctu5}
      KEY: ${KEY:-dev-key-replace-in-production-32chars}
      SECRET: ${SECRET:-dev-secret-replace-in-production-with-64-character-random-string}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8055}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
      DISABLE_TELEMETRY: true
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      EXTENSIONS_AUTO_RELOAD: true
      EXTENSIONS_PATH: /directus/extensions
      LOG_LEVEL: debug
      LOG_STYLE: pretty
      CACHE_ENABLED: false
      DB_EXCLUDE_TABLES: ""
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
    volumes:
      - uploads_local:/directus/uploads
      - extensions_local:/directus/extensions
      - ../extensions/directus-extension-wcag-theme-colex-light:/directus/extensions/directus-extension-wcag-theme-colex-light
      - ../extensions/directus-extension-wcag-theme-colex-dark:/directus/extensions/directus-extension-wcag-theme-colex-dark
      - ../extensions/colex-button-system-bundle:/directus/extensions/colex-button-system-bundle
      - ../extensions/directus-extension-endpoint-orchestrator:/directus/extensions/directus-extension-endpoint-orchestrator
    networks:
      - directus_local

volumes:
  uploads_local:
  extensions_local:
  postgres_data_local:

networks:
  directus_local:
    driver: bridge
